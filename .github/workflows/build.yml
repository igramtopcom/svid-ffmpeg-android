name: Build ffmpeg for Android

# Builds ffmpeg for arm64-v8a and armeabi-v7a (build.sh) on every push and
# by hand. A tag v* also publishes a release: the three files per ABI, their
# SHA-256s, the build info, and every source the build used (the GPL's
# Corresponding Source: sources + these scripts).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq meson ninja-build autoconf automake libtool pkg-config cmake
          . ./versions.sh
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh ${{ matrix.abi }}

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.abi }}
          path: dist/${{ matrix.abi }}/
          retention-days: 30

      # The exact sources this build used, once (they are the same for both ABIs).
      - name: Sources
        if: matrix.abi == 'arm64-v8a'
        run: |
          mkdir -p sources
          cp work/src/*.tar.* sources/
          git -C work/src/x264 archive --format=tar.gz --prefix=x264/ -o "$PWD/sources/x264-$(git -C work/src/x264 rev-parse --short HEAD).tar.gz" HEAD
          git archive --format=tar.gz --prefix=svid-ffmpeg-android/ -o sources/build-scripts.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: matrix.abi == 'arm64-v8a'
        with:
          name: sources
          path: sources/
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          for abi in arm64-v8a armeabi-v7a; do
            for f in libffmpeg.so libffprobe.so libffmpeg.zip.so BUILDINFO.txt; do
              cp "art/ffmpeg-$abi/$f" "out/$abi-$f"
            done
          done
          cp art/sources/* out/
          (cd out && sha256sum * > SHA256SUMS)
          gh release create "${GITHUB_REF_NAME}" out/* --repo "${GITHUB_REPOSITORY}" \
            --title "ffmpeg for Svid Android ${GITHUB_REF_NAME}" \
            --notes "Built by this repository's workflow from the sources attached here (see versions.sh). SHA-256s in SHA256SUMS."
